<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>WeChat spec compliance test · wechat-html-paster</title></head>
<body>
<h2>公众号《内容结构检测》合规自检（移植官方校验器规则）</h2>
<p style="font-size:12px;color:#666;max-width:900px">
规则来源：<code>github.com/wechatjs/verify-article-structure-spec/cli/engine/rules/*.ts</code> 与
<code>cli/engine/nest.ts</code>（MAX_STYLE_LEVEL=15），逐条移植。
</p>
<iframe id="app" src="./index.html" style="width:1500px;height:950px"></iframe>
<pre id="results">BOOT</pre>
<script>
const out=[];
function ok(name,cond,extra){ out.push((cond?'PASS ':'FAIL ')+name+(extra?(' | '+extra):'')); }

/* ====== 官方规则移植 ====== */
// helpers.ts getInlineStyleValue
function getInlineStyleValue(node, propName){
  const s = node.getAttribute && node.getAttribute('style');
  if(!s) return null;
  const m = s.match(new RegExp('(^|;)\\s*'+propName+'\\s*:\\s*([^;]+)','i'));
  return m ? m[2].trim() : null;
}
const normalizeFontFamily = f => String(f).replace(/["']/g,'').replace(/\s+/g,' ').trim();
const ALLOWED_FF = normalizeFontFamily('"mp-quote", PingFang SC, system-ui, -apple-system');

function checkFontFamily(n){                       // rules/font-family.ts
  const ff = getInlineStyleValue(n,'font-family');
  return (ff && !normalizeFontFamily(ff).startsWith(ALLOWED_FF)) ? {rule:'font-family',v:ff} : null;
}
function checkTextAlign(n){                        // rules/text-align.ts
  const ta = getInlineStyleValue(n,'text-align');
  return (ta && /^(start|end)$/i.test(ta)) ? {rule:'text-align',v:ta} : null;
}
function checkWidth(n,tag){                        // rules/width.ts（硬违规部分）
  if(tag==='img') return {rule:'width(candidate:img)',v:getInlineStyleValue(n,'width')||'-'};
  if(tag==='table') return null;                   // 其 thead>th 由专门检查处理
  const w = getInlineStyleValue(n,'width');
  if(tag!=='img'&&tag!=='svg'&&w!==null&&w!==''&&!/auto|100%/i.test(w)) return {rule:'width(fixed)',v:w};
  return null;
}
function checkTheadTh(n,tag){                      // rules/width.ts：table>thead>th 一律候选
  if(tag!=='table') return null;
  const thead=n.querySelector('thead'); if(!thead) return null;
  const ths=thead.querySelectorAll('th'); return ths.length?{rule:'width(candidate:thead>th)',v:ths.length+' th'}:null;
}
function checkHeightZero(n,tag){                   // rules/height-zero.ts
  const h=getInlineStyleValue(n,'height');
  if(h!==null&&/^0(px)?$/i.test(h.trim())){
    const t=n.textContent?n.textContent.replace(/\u200b|\s/g,''):'';
    if(t.length>0) return {rule:'height:0 with text',v:h};
  }
  return null;
}
function checkPre(n,tag){                          // rules/pre.ts
  if(tag!=='pre') return null;
  const t=n.textContent?n.textContent.replace(/\u200b|\s/g,''):'';
  return t.length?{rule:'pre',v:''}:null;
}
function checkOpacity(n,tag){                      // rules/opacity.ts
  if(tag!=='img') return null;
  const op=getInlineStyleValue(n,'opacity'), s=n.getAttribute('style')||'';
  if((op!==null&&(/^0(?:\.0+)?$/.test(op)||parseFloat(op)===0))||/opacity\s*:\s*0\b/i.test(s))
    return {rule:'opacity:0 img',v:op||'0'};
  return null;
}
function checkCaret(n){                            // rules/caret-color.ts
  const v=getInlineStyleValue(n,'caret-color');
  if(!v) return null;
  return /rgba\(\s*0\s*,\s*0\s*,\s*0\s*,\s*0\s*\)/i.test(v.replace(/\s+/g,''))?{rule:'caret-color transparent',v}:null;
}
function checkLineHeightOverlap(n,tag,win){        // rules/line-height.ts + layout 叠字
  if(tag==='svg') return null;
  const txt=n.textContent?n.textContent.replace(/\u200b|\s/g,''):'';
  const lh=getInlineStyleValue(n,'line-height');
  if(lh!==null&&/^0(px)?$/i.test(lh.trim())) return txt?{rule:'line-height:0 with text',v:lh}:null;
  if(!txt) return null;
  if(!lh) return null;
  const m=String(lh).match(/^([\d.]+)px$/); if(!m) return null;   // 单值行高由 CSS 计算，跳过
  const fs=parseFloat(win.getComputedStyle(n).fontSize);
  const lhv=parseFloat(m[1]);
  if(lhv<fs*0.99 && n.getClientRects().length>1) return {rule:'line-height < font-size (多行叠字)',v:lh+' < '+fs+'px'};
  return null;
}
const SPECIAL_TAGS=/^(img|svg|video|audio|br|iframe|a)$/i;
function checkNest(root){                          // engine/nest.ts（MAX_STYLE_LEVEL=15 + 删除模拟）
  const MAX=15; let maxLevel=0, hit=null;
  const walk=(node,level)=>{
    if(!node||node.nodeType!==1) return;
    maxLevel=Math.max(maxLevel,level);
    if(level>=MAX&&!hit) hit=node;
    [...node.children].forEach(c=>walk(c,level+1));
  };
  walk(root,1);
  if(!hit) return {violation:null,maxLevel};
  // 单子节点 + 同标签 + 同样式 的冗余包裹层模拟
  let redundant=null;
  const scan=(node)=>{
    if(!node||node.nodeType!==1) return;
    if(node.children.length===1&&node.childNodes.length===1){
      const ch=node.firstElementChild;
      if(ch.tagName===node.tagName&&(ch.getAttribute('style')||'')===(node.getAttribute('style')||'')&&!SPECIAL_TAGS.test(ch.tagName))
        redundant=ch;
    }
    [...node.children].forEach(scan);
  };
  scan(root);
  return {violation:redundant?{rule:'嵌套层级 ≥15 且存在可删冗余层',v:'maxLevel='+maxLevel}:null,maxLevel};
}
function checkSpanLeaf(root){                      // rules 2.2
  const bad=[];
  root.querySelectorAll('span[leaf]').forEach(sp=>{
    if(sp.querySelector('section,div,p,table,ul,ol')) bad.push(sp.tagName);
  });
  return bad.length?{rule:'span[leaf] 内含块级元素',v:bad.length+' 处'}:null;
}
function checkSectionNodeleaf(root){               // rules 2.3
  const bad=[];
  root.querySelectorAll('section[nodeleaf]').forEach(sec=>{
    [...sec.children].forEach(c=>{ if(!/^(IMG|SVG)$/i.test(c.tagName)) bad.push(c.tagName); });
  });
  return bad.length?{rule:'section[nodeleaf] 内含非指定组件',v:bad.length+' 处'}:null;
}
/* 布局类：宽度溢出（规范 1.4.2）——在 375px 视口下实测 */
function checkOverflow(root,win){
  const bad=[];
  root.querySelectorAll('*').forEach(el=>{
    const cs=win.getComputedStyle(el);
    if(cs.position==='absolute'||cs.position==='fixed') return;
    const w=el.getBoundingClientRect().width;
    if(w>375.6+1) bad.push(el.tagName+' '+Math.round(w)+'px');
  });
  return bad.length?{rule:'宽度溢出移动端 375px',v:bad.slice(0,3).join(', ')}+(bad.length>3?(' 等'+bad.length+'处'):''):null;
}

const ifr=document.getElementById('app');
ifr.addEventListener('load',()=>{
  try{
    const w=ifr.contentWindow, d=ifr.contentDocument;
    const $=(id)=>d.getElementById(id);

    $('input').value=d.getElementById('sample').innerHTML.trim();
    w.convert();
    let html=$('output').value;

    // 解析输出
    const doc=new DOMParser().parseFromString(html,'text/html');
    const root=doc.body.firstElementChild;
    ok('输出根节点为 <section>', !!root&&root.tagName==='SECTION', root&&root.tagName);

    // —— 规则 3 字体：必须零 font-family ——
    const ffHits=[...doc.body.querySelectorAll('*')].map(el=>checkFontFamily(el)).filter(Boolean);
    ok('规则3 font-family：零违规', ffHits.length===0, ffHits.length?JSON.stringify(ffHits[0]):'无内联字体');

    const els=[...doc.body.querySelectorAll('*')];
    const collect=(fn)=>els.map(el=>fn(el,el.tagName.toLowerCase())).filter(Boolean);

    // —— 规则 1.6 对齐 ——
    const taHits=collect((el)=>checkTextAlign(el));
    ok('规则1.6 text-align：无 start/end', taHits.length===0, JSON.stringify(taHits[0]||{}));

    // —— 规则 1.4 宽度 ——
    const wHits=collect((el,t)=>checkWidth(el,t)).filter(h=>h.rule==='width(fixed)');
    ok('规则1.4 固定宽度：零违规', wHits.length===0, JSON.stringify(wHits[0]||{}));
    const thHits=collect((el,t)=>checkTheadTh(el,t));
    ok('规则1.4 thead>th 候选：已消除（th→td 归一）', thHits.length===0 && doc.querySelectorAll('th').length===0,
       'th 数='+doc.querySelectorAll('th').length+' thead 数='+doc.querySelectorAll('thead').length);
    const imgW=collect((el,t)=>t==='img'?checkWidth(el,t):null);
    ok('规则1.4 图片宽高属性：img 候选（有图时需 data-w）', true, 'img 数='+imgW.length);

    // —— 规则 1.5 高度 ——
    const hHits=collect((el,t)=>checkHeightZero(el,t));
    ok('规则1.5 height:0：零违规', hHits.length===0, JSON.stringify(hHits[0]||{}));

    // —— 规则 1.8 pre ——
    const preHits=collect((el,t)=>checkPre(el,t));
    ok('规则1.8 pre：无 <pre>', preHits.length===0 && doc.querySelectorAll('pre').length===0);

    // —— 规则 1.1 opacity / 1.2 caret-color ——
    const opHits=collect((el,t)=>checkOpacity(el,t));
    ok('规则1.1 opacity:0：零违规', opHits.length===0, JSON.stringify(opHits[0]||{}));
    const ccHits=collect((el)=>checkCaret(el));
    ok('规则1.2 caret-color：零违规', ccHits.length===0, JSON.stringify(ccHits[0]||{}));

    // —— 规则 1.3 line-height（把输出挂进一个 375px 容器实测）——
    const probe=d.createElement('div');
    probe.style.cssText='position:fixed;left:-10000px;top:0;width:375px;';
    probe.innerHTML=html;
    d.body.appendChild(probe);
    const lhHits=[...probe.querySelectorAll('*')].map(el=>checkLineHeightOverlap(el,el.tagName.toLowerCase(),w)).filter(Boolean);
    ok('规则1.3 line-height 叠字：零违规', lhHits.length===0, JSON.stringify(lhHits[0]||{}));

    // —— 规则 1.4.2 溢出（375px 实测）——
    const ov=checkOverflow(probe,w);
    ok('规则1.4.2 移动端 375px 无横向溢出', !ov, ov?ov.v:'无溢出');
    // 表格单独看列是否撑破
    const tbl=probe.querySelector('table');
    ok('表格在 375px 内自适应', !tbl||tbl.getBoundingClientRect().width<=375.6,
       tbl?Math.round(tbl.getBoundingClientRect().width)+'px':'无表格');
    probe.remove();

    // —— 规则 2.1 嵌套 ——
    const nest=checkNest(root);
    ok('规则2.1 嵌套深度 < 15 且无冗余层', !nest.violation, 'maxLevel='+nest.maxLevel);

    // —— 规则 2.2 / 2.3 ——
    ok('规则2.2 span[leaf]：不产生 leaf 容器', !checkSpanLeaf(root));
    ok('规则2.3 section[nodeleaf]：不产生 nodeleaf 容器', !checkSectionNodeleaf(root));

    // —— 附加：结构卫生 ——
    ok('无 class 属性残留', !/\sclass=/i.test(html));
    ok('无 id 属性残留', !/\sid=/i.test(html));
    ok('无 <style>/<script> 残留', !/<(style|script)/i.test(html));

    // ========== 真实场景回归：line-height 叠字（用户线上告警复现）==========
    // 官方 layout.ts detectLineHeightOverlap：lineHeight===0，或 实测平均行高 < fontSize*0.95
    function officialOverlap(win,scope){
      const bad=[];
      scope.querySelectorAll('*').forEach(el=>{
        const cs=win.getComputedStyle(el);
        const fs=parseFloat(cs.fontSize); if(!isFinite(fs)||!fs) return;
        const lhRaw=cs.lineHeight;
        const lh=lhRaw==='normal'?fs*1.2:parseFloat(lhRaw);
        const txt=(el.textContent||'').replace(/\u200b|\s/g,'');
        if(!txt) return;
        if(isFinite(lh)&&lh===0){ bad.push(el.tagName+' line-height:0'); return; }
        const rects=el.getClientRects().length||1;
        const h=el.getBoundingClientRect().height;
        const avg=rects>0?h/rects:h;
        if(avg<fs*0.95) bad.push(el.tagName+' avgLineHeight='+avg.toFixed(1)+' < '+ (fs*0.95).toFixed(1));
      });
      return bad;
    }
    const fixtures=[
      {name:'line-height:0 且有文字',html:'<style>body{background:#fff;color:#333;line-height:0;padding:16px}p{font-size:15px;margin:0 0 12px}</style><div><p>这是一段很长很长的正文，用于折行测试行高是否合规。</p><p>第二段同样很长很长很长很长很长很长很长。</p></div>'},
      {name:'大字号行内元素继承小行高',html:'<style>body{background:#fff;color:#333;padding:16px}p{font-size:15px;line-height:1.9;margin:0 0 12px}.big{font-size:30px;font-weight:700}</style><div><p>含 <span class="big">30px大字</span> 的行内元素，父行高小时会叠字。</p><p>普通段落也很长很长很长很长很长很长很长很长很长很长。</p></div>'}
    ];
    fixtures.forEach(fx=>{
      $('input').value=fx.html;
      w.convert();
      const pr=d.createElement('div');
      pr.style.cssText='position:fixed;left:-10000px;top:0;width:375px';
      pr.innerHTML=$('output').value;
      d.body.appendChild(pr);
      const bad=officialOverlap(w,pr);
      ok('行高叠字（'+fx.name+'）：零违规', bad.length===0, bad.slice(0,3).join(' | ')||'0 处');
      pr.remove();
    });

    document.getElementById('results').textContent=out.join('\n');
  }catch(e){
    document.getElementById('results').textContent='ERROR: '+e.message+'\n'+(e.stack||'');
  }
});
</script>
</body>
</html>
