<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>v3 functional tests · wechat-html-paster</title></head>
<body>
<h2>功能回归测试 v3</h2>
<iframe id="app" src="./index.html" style="width:1500px;height:950px"></iframe>
<pre id="results">BOOT</pre>
<script>
const out=[];
function ok(name,cond,extra){ out.push((cond?'PASS ':'FAIL ')+name+(extra?(' | '+extra):'')); }
const ifr=document.getElementById('app');
ifr.addEventListener('load',()=>{
  try{
    const w=ifr.contentWindow, d=ifr.contentDocument;
    const $=(id)=>d.getElementById(id);
    const sel=()=>ifr.contentWindow.getSelection();
    const selectIn=(el)=>{ const r=d.createRange(); r.selectNodeContents(el); sel().removeAllRanges(); sel().addRange(r); return r; };
    const q=(s)=>d.querySelector('#preview '+s);

    // ---------- 1. 转换 + 合规归一 ----------
    $('input').value=d.getElementById('sample').innerHTML.trim();
    w.convert();
    let html=$('output').value;
    ok('转换产出 <section> 根', html.indexOf('<section')===0, html.slice(0,32));
    ok('输出零 font-family（规则3）', !/font-family/i.test(html));
    ok('输出无 text-align:start/end（规则1.6）', !/text-align:\s*(start|end)/i.test(html));
    ok('thead/th 归一为 tbody/td', !/<thead|<th[\s>]/i.test(html) && /<tbody|<td[\s>]/i.test(html));
    ok('无 class/id/style 标签残留', !/\sclass=/i.test(html)&&!/\sid=/i.test(html)&&!/<style/i.test(html));

    // ---------- 2. 品牌色识别 ----------
    const b=w.detectBrand();
    ok('识别品牌色 = #0A5E44', !!b&&b.r===10&&b.g===94&&b.b===68, JSON.stringify(b));

    // ---------- 3. 主题色全局重绘（HSL 色族映射）----------
    w.setThemeColor('#FA5151');
    let h1=$('output').value;
    ok('主题色：主色已重绘', h1.indexOf('rgb(250, 81, 81)')>=0);
    ok('主题色：旧主色已消失', h1.indexOf('rgb(10, 94, 68)')<0);
    ok('主题色：浅色底（alpha 保留）跟着走', h1.indexOf('rgba(250, 81, 81, 0.06)')>=0, (h1.match(/rgba\(250, 81, 81[^)]*\)/)||['无'])[0]);
    ok('主题色：无关红色 #D6001C 保留', /214, 0, 28/.test(h1));
    // 反复切换不漂移
    w.setThemeColor('#009874');
    let h2=$('output').value;
    ok('再次切换主题色生效', h2.indexOf('rgb(0, 152, 116)')>=0 && h2.indexOf('rgb(250, 81, 81)')<0);
    w.setThemeColor('#0F4C81');
    ok('第三次切换仍干净（无累积漂移）', $('output').value.indexOf('rgb(15, 76, 129)')>=0);
    ok('主题色 UI 同步', $('themeVal').textContent==='#0F4C81' || $('themeVal').textContent==='#0f4c81', $('themeVal').textContent);

    // ---------- 4. 目标识别：卡片 vs 色块 ----------
    const bq=q('blockquote'); selectIn(bq);
    const t1=w.findContainer(sel().getRangeAt(0));
    ok('引用块识别为卡片', !!t1&&t1.kind==='card', t1&&t1.kind);
    // 插入色块 / 卡片（取「自身文本以关键词开头」的最内层容器）
    const pick=(kw)=>{ const arr=[...d.querySelectorAll('#preview section')]
      .filter(s=>(s.textContent||'').trim().startsWith(kw)); return arr[arr.length-1]; };
    selectIn(q('h2'));
    w.insertColorBlock();
    const block=pick('色块：');
    ok('插入色块成功', !!block);
    ok('色块无边框（纯底色盒）', !!block&&!block.style.getPropertyValue('border')&&!block.style.getPropertyValue('border-left'),
       block&&(block.getAttribute('style')||'').slice(0,58));
    selectIn(block);
    const t2=w.findContainer(sel().getRangeAt(0));
    ok('色块被识别为 block（非卡片）', !!t2&&t2.kind==='block', t2&&t2.kind);
    w.insertCard();
    const card=pick('卡片：');
    ok('插入卡片成功', !!card);
    ok('卡片有边框', !!card&&/^\s*1px solid/.test(card.style.getPropertyValue('border')||''), card&&card.style.getPropertyValue('border'));
    selectIn(card);
    const t3=w.findContainer(sel().getRangeAt(0));
    ok('卡片被识别为 card', !!t3&&t3.kind==='card', t3&&t3.kind);
    // 普通段落（主体容器内的直接子段落）不误判
    const plainP=[...d.querySelectorAll('#preview > section > div > p')].pop()||[...d.querySelectorAll('#preview section p')].pop();
    selectIn(plainP);
    ok('普通段落识别为 null（不会误改主体容器）', w.findContainer(sel().getRangeAt(0))===null,
       'tag='+(plainP&&plainP.tagName));

    // ---------- 5. 色块 / 卡片各自独立控件 ----------
    selectIn(block); w.setBlockBg('#ffeecc');
    ok('色块底色可改', block.style.getPropertyValue('background-color')==='rgb(255, 238, 204)');
    w.setBlockBg('');
    ok('色块底色可移除', !block.style.getPropertyValue('background-color'));
    selectIn(card); w.setCardBg('#eef6f2');
    ok('卡片背景可改', card.style.getPropertyValue('background-color')==='rgb(238, 246, 242)');
    w.setCardBg('');
    ok('卡片背景可移除', !card.style.getPropertyValue('background-color'));
    w.setCardBorder('#0000ff');
    ok('卡片边框可改（全边框 1px）', /1px solid rgb\(0, 0, 255\)/.test(card.style.getPropertyValue('border')||''), card.style.getPropertyValue('border'));
    $('cardSide').value='left'; w.setCardBorder('#0000ff');
    ok('卡片边框可改为左边框', /1px solid rgb\(0, 0, 255\)/.test(card.style.getPropertyValue('border-left')||'') && !card.style.getPropertyValue('border'));
    w.setCardBorder('');
    ok('卡片边框可移除', !card.style.getPropertyValue('border-left'));

    // ---------- 6. 段落级 ----------
    const p=q('p'); selectIn(p);
    w.applyToBlocks('background-color','#eeeeee','t');
    ok('段落底色可应用', p.style.getPropertyValue('background-color')==='rgb(238, 238, 238)');
    w.applyToBlocks('background-color','','t');
    ok('段落底色可移除', !p.style.getPropertyValue('background-color'));
    w.applyParaBorder('left','#0A5E44');
    ok('段落边框：左侧强调线', /3px solid/.test(p.style.getPropertyValue('border-left')||''));
    w.applyParaBorder('none','');
    ok('段落边框：可移除', !p.style.getPropertyValue('border-left')&&!p.style.getPropertyValue('border'));

    // ---------- 7. 标题样式 ----------
    const h2el=q('h2'); w.applyHeadingStyle('bottom',true); w.syncFromPreview&&0;
    ok('标题样式：下边框（主题色）', /2px solid/.test(h2el.style.getPropertyValue('border-bottom')||''), h2el.style.getPropertyValue('border-bottom'));
    w.applyHeadingStyle('color',true);
    ok('标题样式：主题色文字', !!h2el.style.getPropertyValue('color'));
    w.applyHeadingStyle('none',true);
    ok('标题样式：默认（清除本工具施加的痕迹）', !h2el.style.getPropertyValue('border-bottom')&&!h2el.style.getPropertyValue('color'));

    // ---------- 8. 导出扁平化 ----------
    const want=q('p');
    const deep=d.createElement('span'); deep.setAttribute('style','color:rgb(15, 76, 129);');
    let cur=deep;
    for(let i=0;i<12;i++){ const s=d.createElement('span'); s.setAttribute('style','color:rgb(15, 76, 129);'); cur.appendChild(s); cur=s; }
    cur.textContent='嵌套测试';
    want.appendChild(deep);
    w.normalizeExport();
    let depth=0, el=want.querySelector('span');
    while(el){ depth++; el=el.firstElementChild; }
    ok('导出扁平化：13 层同样式 span 链压成 1 层', depth===1, 'depth='+depth);
    ok('扁平化后文本保留', want.textContent.indexOf('嵌套测试')>=0);

    // ---------- 9. 菜单（Word 式）----------
    const menus=[...d.querySelectorAll('.menu')];
    ok('菜单条含 6 个 Word 式菜单', menus.length===6, menus.map(m=>m.querySelector('.menu-btn').textContent).join('/'));
    const fmt=menus.find(m=>m.dataset.menu==='format');
    fmt.querySelector('.menu-btn').click();
    ok('点击菜单展开面板', fmt.classList.contains('open'));
    const styleMenu=menus.find(m=>m.dataset.menu==='style');
    styleMenu.querySelector('.menu-btn').click();
    ok('菜单互斥（打开另一个自动收起前一个）', styleMenu.classList.contains('open')&&!fmt.classList.contains('open'));
    d.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
    ok('Esc 关闭菜单', !styleMenu.classList.contains('open'));
    ok('面板内按 Word 分组（组名在组底部）',
       [...styleMenu.querySelectorAll('.mgroup-name')].map(e=>e.textContent).join('/')==='主题色/标题/色块/卡片/页面',
       [...styleMenu.querySelectorAll('.mgroup-name')].map(e=>e.textContent).join('/'));

    // ---------- 10. 已移除的旧控件 ----------
    ok('「主体底色」已移除', !$('mainBg')&&!d.querySelector('#mainSw'));
    ok('「字体族」选择器已移除（合规）', !$('fontFamily'));

    // ---------- 11. 撤销 ----------
    const before=$('output').value;
    w.undo();
    ok('撤销可用', $('output').value!==before || $('output').value.length>0);

    document.getElementById('results').textContent=out.join('\n');
  }catch(e){
    document.getElementById('results').textContent='ERROR: '+e.message+'\n'+(e.stack||'');
  }
});
</script>
</body>
</html>
