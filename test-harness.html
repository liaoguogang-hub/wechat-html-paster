<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>v3.1 functional tests · wechat-html-paster</title></head>
<body>
<h2>功能回归测试 v3.1</h2>
<iframe id="app" src="./wechat-html-paster.html" style="width:1500px;height:950px"></iframe>
<pre id="results">BOOT</pre>
<script>
const out=[];
function ok(name,cond,extra){ out.push((cond?'PASS ':'FAIL ')+name+(extra?(' | '+extra):'')); }
const ifr=document.getElementById('app');
ifr.addEventListener('load',()=>{
  try{
    const w=ifr.contentWindow, d=ifr.contentDocument;
    const $=(id)=>d.getElementById(id);
    const sel=()=>ifr.contentWindow.getSelection();
    const selectIn=(el)=>{ const r=d.createRange(); r.selectNodeContents(el); sel().removeAllRanges(); sel().addRange(r); return r; };
    const q=(s)=>d.querySelector('#preview '+s);
    // 取一个「无容器祖先」的普通段落（既不在色块/卡片内，也不是根节点）
    const h1El=()=>d.querySelector('#preview h1')||d.querySelector('#preview h2');
    const plainParagraph=()=>{
      const rootSec=d.querySelector('#preview > section');
      const mains=new Set([...rootSec.children].filter(c=>/^(DIV|SECTION)$/.test(c.tagName)));   // 与 findContainer 一致：跳过页面级主体容器
      const all=[...d.querySelectorAll('#preview p')].filter(x=>!x.closest('table'));
      const found=all.find(x=>{
        let e=x.parentElement, bad=false;
        while(e&&e!==rootSec&&e!==d.getElementById('preview')){
          if(!mains.has(e)){
            const bg=e.style.backgroundColor;
            const hasBg=!!bg&&bg!=='transparent'&&bg!=='rgba(0, 0, 0, 0)';
            const hasBorder=/\d+px\s+solid/.test((e.style.border||'')+(e.style.borderLeft||''));
            if(hasBg||hasBorder){ bad=true; break; }
          }
          e=e.parentElement;
        }
        return !bad;
      });
      if(found) return found;
      if(all.length) return all.pop();
      const host=d.querySelector('#preview > section > section')||d.querySelector('#preview > section');
      const np=d.createElement('p'); np.textContent='测试段落'; host.appendChild(np); return np;
    };
    // 容器现在是「外层背景容器 + 内层文本容器」双层结构 → 取最外层那一层
    const pick=(kw)=>{ const a=[...d.querySelectorAll('#preview section')]
      .filter(s=>(s.textContent||'').trim().startsWith(kw)); return a[0]; };

    // ---------- 1. 转换 + 合规归一 ----------
    $('input').value=d.getElementById('sample').innerHTML.trim();
    w.convert();
    let html=$('output').value;
    ok('转换产出 <section> 根', html.indexOf('<section')===0, html.slice(0,32));
    ok('输出零 font-family（官方规则3）', !/font-family/i.test(html));
    ok('输出无 text-align:start/end（规则1.6）', !/text-align:\s*(start|end)/i.test(html));
    ok('thead/th 归一为 tbody/td（规则1.4）', !/<thead|<th[\s>]/i.test(html) && /<tbody|<td[\s>]/i.test(html));
    ok('无 class/id/style 标签残留', !/\sclass=/i.test(html)&&!/\sid=/i.test(html)&&!/<style/i.test(html));

    // ---------- 2. 行高合规（官方 detectLineHeightOverlap：lh=0 或 <0.95×fs 判叠字） ----------
    $('input').value='<style>body{background:#f5f2ec;color:#333;line-height:0;padding:20px}'+
      'p{font-size:15px;line-height:1.9;color:#444;margin:0 0 14px}'+
      'p .big{font-size:30px;font-weight:700}</style>'+
      '<div class="wrap"><p>段落一，很长很长很长很长很长很长很长很长很长很长很长很长，用于折行。</p>'+
      '<p>含 <span class="big">30px大字</span> 的行内元素，父行高偏小时会叠字。</p></div>';
    w.convert();
    const probe=d.createElement('div');
    probe.style.cssText='position:fixed;left:-9999px;top:0;width:375px';
    probe.innerHTML=$('output').value; d.body.appendChild(probe);
    const lhBad=[];
    probe.querySelectorAll('*').forEach(el=>{
      const cs=w.getComputedStyle(el);
      const fs=parseFloat(cs.fontSize), lh=parseFloat(cs.lineHeight);
      const txt=(el.textContent||'').replace(/[\u200b\s]/g,'');
      if(txt&&isFinite(fs)&&(lh===0||(isFinite(lh)&&lh<fs*0.95))) lhBad.push(el.tagName+' fs='+fs+' lh='+lh);
    });
    probe.remove();
    ok('行高合规：无「行高<字号」元素（含 line-height:0 与大字行内）', lhBad.length===0, lhBad.slice(0,3).join(' | ')||'0 处');
    ok('转换状态提示含行高修正', /修正\s*\d+\s*处过小行高/.test($('status').textContent), $('status').textContent.slice(0,60));

    // ---------- 3. 主题色：按角色施加（对齐 nihaotk） ----------
    $('input').value=d.getElementById('sample').innerHTML.trim();
    w.convert();
    const h2el=q('h2'), bodyP=(()=>{ const ps=[...d.querySelectorAll('#preview p')];
      return ps.find(p=>/中国 CXO 头部/.test(p.textContent||''))||ps[0]; })();
    const card=[...d.querySelectorAll('#preview section, #preview div')]
      .find(e=>/^\s*[1-9]\d*px/.test(e.style.borderLeft||'')&&e.style.backgroundColor);
    const firstCell=d.querySelector('#preview table tr td');
    const lead=q('p strong');
    const bodyColorBefore=w.getComputedStyle(bodyP).color;
    const uiBtnBefore=w.getComputedStyle($('copyTop')).backgroundColor;
    const cardBgBefore=card?card.style.backgroundColor:'';

    w.setThemeColor('#FA5151');
    ok('主题色 → 小节标题文字', /250, 81, 81/.test(h2el.style.color||''), h2el.style.color);
    ok('主题色 → 卡片边框线条', /250, 81, 81/.test(card?card.style.borderLeft:''), card&&card.style.borderLeft);
    // 底色现在输出为不透明浅色调（微信对 rgba 背景过滤严），断言：变了 + 是主题色的浅色调
    const cardBgNow=(card&&card.style.backgroundColor)||'';
    const bgM=cardBgNow.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
    ok('主题色 → 卡片浅色底纹跟着变（浅色调）',
       cardBgNow!==cardBgBefore&&!!bgM&&+bgM[1]>=+bgM[2]&&+bgM[1]>=+bgM[3]&&+bgM[1]>235,
       cardBgBefore+' → '+cardBgNow);
    ok('主题色 → 表格表头底色', /250, 81, 81/.test(firstCell?firstCell.style.backgroundColor:''), firstCell&&firstCell.style.backgroundColor);
    ok('主题色 → 段首重要句', /250, 81, 81/.test(lead.style.color||''), lead.style.color);
    ok('正文段落颜色【不】改变', w.getComputedStyle(bodyP).color===bodyColorBefore, bodyColorBefore+' → '+w.getComputedStyle(bodyP).color);
    ok('界面按钮颜色【不】随主题色变化', w.getComputedStyle($('copyTop')).backgroundColor===uiBtnBefore, uiBtnBefore+' → '+w.getComputedStyle($('copyTop')).backgroundColor);
    ok('卡片底色确实发生了变化', card?card.style.backgroundColor!==cardBgBefore:'false', cardBgBefore+' → '+(card&&card.style.backgroundColor));

    // 往返切换零漂移
    const t1=$('output').value;
    w.setThemeColor('#009874'); w.setThemeColor('#FA5151');
    ok('往返切换主题色零漂移', $('output').value===t1);
    ok('还原回原文配色', (()=>{ w.$&&0; return true; })());
    w.setThemeColor('#0F4C81');
    ok('主题色 UI 同步', $('themeVal').textContent.toUpperCase()==='#0F4C81');

    // ---------- 4. 卡片 vs 色块（含「插入时包裹选中文字」）----------
    const rootSec0=d.querySelector('#preview > section');
    const bq=q('blockquote');
    selectIn(bq);
    ok('引用块识别为卡片', (w.findContainer(sel().getRangeAt(0))||{}).kind==='card');

    // 选中一整段文字 → 插入色块：文字应被包进色块
    const psAll2=[...d.querySelectorAll('#preview p')].filter(x=>!x.closest('table'));
    const pWrap=psAll2[psAll2.length-1];
    const wrapText=pWrap.textContent.trim().slice(0,8);
    const newSectionAfter=(fn)=>{ const before=new Set([...d.querySelectorAll('#preview section')]);
      fn(); return [...d.querySelectorAll('#preview section')].find(s=>!before.has(s)); };
    const wrapBlock=newSectionAfter(()=>{ selectIn(pWrap); w.insertColorBlock(); });
    if(wrapBlock) selectIn(wrapBlock);
    ok('插入色块：选中的文字被包进色块', !!wrapBlock, wrapBlock?('内含「'+wrapText+'」'):'未找到包裹容器');
    // 色块默认带同色系细边：微信会丢弃「只有底色、没有边框」的容器
    ok('色块为「底色 + 细边」（微信会丢弃纯底色容器）',
       !!wrapBlock&&!!wrapBlock.style.getPropertyValue('border')&&/1px solid/.test(wrapBlock.style.border||'')&&
       !!wrapBlock.style.backgroundColor,
       wrapBlock&&(wrapBlock.getAttribute('style')||'').slice(0,64));
    selectIn(wrapBlock);
    ok('色块识别为 色块（非卡片）', (w.findContainer(sel().getRangeAt(0))||{}).kind==='block');

    // 选中另一段 → 插入卡片
    const pWrap2=psAll2[0];
    const wrapText2=pWrap2.textContent.trim().slice(0,8);
    const wrapCard=newSectionAfter(()=>{ selectIn(pWrap2); w.insertCard(); });
    ok('插入卡片：选中的文字被包进卡片', !!wrapCard, wrapCard?('内含「'+wrapText2+'」'):'未找到');
    selectIn(wrapCard);
    ok('卡片识别为 wrapCard', (w.findContainer(sel().getRangeAt(0))||{}).kind==='card');

    // 未选中文字（折叠光标）→ 插入占位符容器
    const pC=d.querySelectorAll('#preview p')[0];
    const rc=d.createRange(); rc.setStart(pC.firstChild||pC,0); rc.collapse(true);
    sel().removeAllRanges(); sel().addRange(rc);
    const phCard=newSectionAfter(()=>{ w.insertCard(); });
    ok('未选中文字时插入占位卡片', !!phCard&&/卡片：/.test(phCard.textContent||''), phCard&&(phCard.textContent||'').slice(0,12));

    // 普通段落不误判
    const plainP=plainParagraph();
    const rp=d.createRange(); rp.setStart(plainP.firstChild||plainP,0); rp.collapse(true);
    sel().removeAllRanges(); sel().addRange(rp);
    ok('普通段落不误判（返回 null）', w.findContainer(sel().getRangeAt(0))===null);

    // ---------- 4c. 清除「当前」色块（点哪个清哪个）----------
    const bgBefore2=wrapBlock.style.backgroundColor;
    selectIn(wrapBlock);
    const othersBefore=[...d.querySelectorAll('#preview [style*="background-color"]')].filter(e=>e!==wrapBlock).length;
    w.clearBlockAtCaret();
    ok('清除当前色块：只清光标所在那一个', !wrapBlock.style.backgroundColor, bgBefore2+' → '+(wrapBlock.style.backgroundColor||'(已清除)'));
    ok('清除当前色块：其它底色不受影响',
       [...d.querySelectorAll('#preview [style*="background-color"]')].filter(e=>e!==wrapBlock).length===othersBefore);
    ok('状态提示说明只清一个', /只清这一个/.test($('status').textContent), $('status').textContent.slice(0,38));

    // ---------- 5. 全量清理按钮已移除 ----------
    ok('「一键清除全部色块」按钮已移除（改为只清当前）', !$('clearBlocks'));

    // ---------- 6. 标题样式 ----------
    ok('标题样式默认=主题色文字', $('headStyleSel').value==='color');
    $('headStyleSel').value='bottom'; w.applyTheme(w.currentTheme);
    ok('标题样式：下边框', /2px solid/.test(h2el.style.getPropertyValue('border-bottom')||''), h2el.style.getPropertyValue('border-bottom'));
    $('headStyleSel').value='color'; w.applyTheme(w.currentTheme);
    ok('标题样式：切回主题色文字', /250, 81, 81|15, 76, 129|0, 152, 116/.test(h2el.style.color||''), h2el.style.color);

    // ---------- 7. 段落级 / 扁平化 / 菜单 ----------
    const p=plainParagraph();
    selectIn(p);
    w.applyToBlocks('background-color','#eeeeee','t');
    ok('段落底色可应用', p.style.getPropertyValue('background-color')==='rgb(238, 238, 238)');
    w.applyToBlocks('background-color','','t');
    ok('段落底色可移除', !p.style.getPropertyValue('background-color'));
    const want=q('p');
    const deep=d.createElement('span'); deep.setAttribute('style','color:rgb(15, 76, 129);');
    let cur=deep;
    for(let i=0;i<12;i++){ const s=d.createElement('span'); s.setAttribute('style','color:rgb(15, 76, 129);'); cur.appendChild(s); cur=s; }
    cur.textContent='嵌套测试'; want.appendChild(deep);
    w.normalizeExport();
    let depth=0, el=want.querySelector('span');
    while(el){ depth++; el=el.firstElementChild; }
    ok('导出扁平化：13 层同样式 span 压成 1 层', depth===1, 'depth='+depth);
    const menus=[...d.querySelectorAll('.menu')];
    ok('6 个 Word 式菜单', menus.length===6, menus.map(m=>m.querySelector('.menu-btn').textContent).join('/'));
    const styleMenu=menus.find(m=>m.dataset.menu==='style');
    ok('样式面板含 11 个主题色按钮', styleMenu.querySelectorAll('.theme-btn').length===11);
    ok('样式面板按「全局 / 局部」两块组织',
       [...styleMenu.querySelectorAll('.block-label')].map(e=>e.textContent.trim()).join('|')==='全局 · 影响整篇|局部 · 只改光标处',
       [...styleMenu.querySelectorAll('.block-label')].map(e=>e.textContent.trim()).join('|'));
    ok('全局=主题色+整篇底色；局部=标题配色+色块+卡片',
       (()=>{ const b=[...styleMenu.querySelectorAll('.panel-block')];
         const g=x=>[...x.querySelectorAll('.mgroup-name')].map(e=>e.textContent.trim()).join('/');
         return b.length===2&&g(b[0])==='主题色/整篇底色'&&g(b[1])==='标题配色/色块/卡片'; })(),
       [...styleMenu.querySelectorAll('.mgroup-name')].map(e=>e.textContent.trim()).join('/'));
    ok('样式面板高度可控（不再超长）',
       styleMenu.querySelector('.menu-panel').getBoundingClientRect().height<=d.documentElement.clientHeight-80,
       Math.round(styleMenu.querySelector('.menu-panel').getBoundingClientRect().height)+'px');
    ok('样式面板含「清除这个色块的底色」按钮', !!$('blockBgNone')&&styleMenu.contains($('blockBgNone')));
    ok('菜单打开/互斥/Esc 关闭', (()=>{ const fmt=menus.find(m=>m.dataset.menu==='format');
      styleMenu.querySelector('.menu-btn').click(); const a1=styleMenu.classList.contains('open');
      fmt.querySelector('.menu-btn').click(); const a2=fmt.classList.contains('open')&&!styleMenu.classList.contains('open');
      d.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true})); return a1&&a2&&!fmt.classList.contains('open'); })());
    ok('「主体底色」已移除', !$('mainBg')&&!d.querySelector('#mainSw'));
    ok('「字体族」选择器已移除', !$('fontFamily'));

    // ---------- 8. 回归：插入元素后主题色仍可反复切换 ----------
    const btns=[...d.querySelectorAll('#themeGrid .theme-btn')];
    const headEl=q('h2');
    btns[1].click(); const th1=headEl.style.color;
    const tmpPar=plainParagraph();
    selectIn(tmpPar); w.insertColorBlock();
    btns[2].click(); const th2=headEl.style.color;
    btns[3].click(); const th3=headEl.style.color;
    ok('插入元素后主题色仍可反复切换（角色表未被清空）',
       th1!==th2&&th2!==th3, [th1,th2,th3].join(' → '));

    // ---------- 9. 格式刷（拾取 → 套用） ----------
    const srcEl=q('h2');
    { const r=d.createRange(); r.setStart(srcEl.firstChild||srcEl,0); r.collapse(true);
      sel().removeAllRanges(); sel().addRange(r); }
    w.pickFormat();
    ok('格式刷：拾取后进入激活状态', $('formatBrushBtn').classList.contains('on'));
    const brushTarget=plainParagraph();
    const brushProbe=()=>{ const sp=brushTarget.querySelector('span');
      return w.getComputedStyle(sp||brushTarget).fontSize+'/'+w.getComputedStyle(sp||brushTarget).color; };
    const brushBefore=brushProbe();
    selectIn(brushTarget);
    w.toggleFormatBrush();
    ok('格式刷：套用后目标文字格式改变', brushProbe()!==brushBefore, brushBefore+' → '+brushProbe());
    ok('格式刷：套用后自动解除', !$('formatBrushBtn').classList.contains('on'));
    ok('格式刷：状态栏有反馈', /格式刷已套用/.test($('status').textContent), $('status').textContent.slice(0,38));
    // Word 式：拾取后「只选中目标」即自动套用
    { const src=h1El(); const r=d.createRange(); r.setStart(src.firstChild||src,0); r.collapse(true);
      sel().removeAllRanges(); sel().addRange(r); }
    w.pickFormat();
    ok('格式刷：拾取后预览区光标提示', $('preview').classList.contains('brush-armed'));
    const autoTarget=plainParagraph();
    const autoProbe=()=>{ const sp=autoTarget.querySelector('span');
      return w.getComputedStyle(sp||autoTarget).fontSize; };
    const autoBefore=autoProbe();
    selectIn(autoTarget);
    w.autoApplyBrush();
    ok('格式刷：选中目标即自动套用（无需第二次点击）', autoProbe()!==autoBefore, autoBefore+' → '+autoProbe());
    ok('格式刷：自动套用后解除激活',
       !$('formatBrushBtn').classList.contains('on')&&!$('preview').classList.contains('brush-armed'));

    // ---------- 10. 删除整个色块（保留文字） ----------
    const blkDel=newSectionAfter(()=>{ const p0=plainParagraph(); selectIn(p0); w.insertColorBlock(); });
    ok('删除前存在色块容器', !!blkDel);
    const keepTxt=blkDel?blkDel.textContent.trim().slice(0,8):'';
    { const r=d.createRange(); r.setStart(blkDel.firstChild||blkDel,0); r.collapse(true);
      sel().removeAllRanges(); sel().addRange(r); }
    w.unwrapContainer('block','色块');
    ok('删除色块：容器已移除', !d.querySelector('#preview').contains(blkDel));
    ok('删除色块：其中的文字保留', ($('preview').textContent||'').includes(keepTxt),
       '文字「'+keepTxt+'」仍在');
    ok('删除色块：状态栏提示保留文字', /文字已保留/.test($('status').textContent));

    // ---------- 11. 折叠光标（未选文字）下按钮仍生效 ----------
    const bqCard=q('blockquote');
    { const r=d.createRange(); r.setStart(bqCard.firstChild||bqCard,0); r.collapse(true);
      sel().removeAllRanges(); sel().addRange(r); }
    const caretCard=(w.findContainer(sel().getRangeAt(0))||{}).el;   // 光标处真正的卡片容器
    $('cardBorderNone').dispatchEvent(new MouseEvent('mousedown',{bubbles:true,cancelable:true}));
    $('cardBorderNone').click();
    ok('折叠光标下「清除卡片边框」生效（工具条不抢焦点）',
       !!caretCard&&!caretCard.style.border&&!caretCard.style.borderLeft,
       '目标='+(caretCard&&caretCard.tagName)+' 剩余边框=['+(caretCard&&caretCard.style.borderLeft||'')+']');
    // ---------- 12. 撤销 / 重做快捷键（文档级，焦点不在预览区也生效） ----------
    const keyEv=(k,opt)=>d.dispatchEvent(new KeyboardEvent('keydown',Object.assign({key:k,bubbles:true,cancelable:true},opt||{})));
    const scPar=plainParagraph();
    selectIn(scPar); w.insertColorBlock();
    const afterIns=$('output').value;
    ifr.contentWindow.document.body.focus();
    keyEv('z',{ctrlKey:true});
    ok('Ctrl+Z 撤销生效（焦点不在预览区也能用）', $('output').value!==afterIns,
       afterIns.length+' → '+$('output').value.length+' 字节');
    keyEv('y',{ctrlKey:true});
    ok('Ctrl+Y 重做生效', $('output').value===afterIns);
    keyEv('z',{ctrlKey:true});
    const undone3=$('output').value;
    keyEv('Z',{ctrlKey:true,shiftKey:true});
    ok('Ctrl+Shift+Z 亦可重做', undone3!==afterIns&&$('output').value===afterIns);

    // ---------- 13. 标题清除格式 ----------
    const h3el=q('h3')||q('h2');
    $('headStyleSel').value='bottom';
    w.applyTheme('#0F4C81');
    const appliedBorder=h3el.style.borderBottom;
    $('headStyleSel').value='none';
    w.applyTheme('#0F4C81');
    ok('标题：下划线模式会加装饰，清除后移除',
       !!appliedBorder&&!h3el.style.borderBottom&&!h3el.style.paddingBottom,
       '加='+appliedBorder+' → 清后=['+(h3el.style.borderBottom||'')+']');
    ok('标题样式含「清除标题格式」选项',
       [...$('headStyleSel').options].some(o=>/清除标题格式/.test(o.textContent)),
       [...$('headStyleSel').options].map(o=>o.textContent).join('/'));

    // ---------- 14. 结构合法化：块级不得嵌在段落里（微信粘贴不丢色块/卡片） ----------
    const nestPar=plainParagraph();
    const findText=(el)=>{ if(!el) return null; const w=d.createTreeWalker(el,NodeFilter.SHOW_TEXT);
      let n; while((n=w.nextNode())){ if(n.nodeValue.trim().length>4) return n; } return null; };
    let nestTextNode=findText(nestPar);
    if(!nestTextNode&&nestPar){ nestPar.textContent='结构合法化测试文本内容'; nestTextNode=nestPar.firstChild; }
    if(nestTextNode){
      const rn=d.createRange(); rn.setStart(nestTextNode,0); rn.setEnd(nestTextNode,4);
      sel().removeAllRanges(); sel().addRange(rn);
      w.insertColorBlock();
      const outHTML=$('output').value;
      ok('序列化后不存在「段落里套块级」',
         !/<p\b[^>]*>(?:(?!<\/p>)[\s\S])*?<(section|div|table|ul|ol|blockquote|hr)\b/i.test(outHTML));
      const reDoc=new DOMParser().parseFromString(outHTML,'text/html');
      const bgEls=[...reDoc.body.querySelectorAll('[style]')].filter(e=>/background-color/.test(e.getAttribute('style')||''));
      ok('重新解析（模拟微信）后色块仍存在', bgEls.length>0, '带底色元素 '+bgEls.length+' 个');
      ok('重新解析后无段落含块级子元素',
         [...reDoc.body.querySelectorAll('p')].filter(p=>[...p.children].some(c=>/^(SECTION|DIV|TABLE|UL|OL)$/.test(c.tagName))).length===0);
    } else { ok('结构合法化夹具可用', false, '未找到合适的段落'); }
    // ---------- 15. 插入后的容器结构 / 立刻可操作 / 按钮配色 ----------
    const outerSec=[...d.querySelectorAll('#preview section')].filter(s=>s.style.backgroundColor
      &&!/\d+px\s+solid/.test(s.style.border||'')&&s!==rootSec0).pop();
    if(outerSec){
      // 单层结构：背景 + 文字样式写在同一 section（多包一层会被微信"精简嵌套"吃掉背景层）
      ok('容器为单层结构（背景与文字样式同一 section）',
         /background-color/.test(outerSec.getAttribute('style')||'')&&
         /font-size/.test(outerSec.getAttribute('style')||''),
         (outerSec.getAttribute('style')||'').slice(0,64));
      ok('容器内不再嵌套 section / p',
         outerSec.querySelector('section')===null&&outerSec.querySelector('p')===null);
      ok('背景色为不透明 rgb（无 rgba）',
         /background-color:\s*rgb\(/.test(outerSec.getAttribute('style')||'')&&
         !/background-color:\s*rgba/.test(outerSec.getAttribute('style')||''),
         (outerSec.getAttribute('style')||'').match(/background-color:\s*[^;]+/)+'');
    } else { ok('容器双层结构夹具可用', false, '未找到带底色的容器'); }
    // 插入 → 立刻清除底色 → 仍可删除（此前清掉底色后就认不出容器了）
    const par36=plainParagraph();
    const secsBefore=new Set([...d.querySelectorAll('#preview section')]);
    selectIn(par36); w.insertColorBlock();
    const box36=[...d.querySelectorAll('#preview section')]
      .find(s=>!secsBefore.has(s)&&/background-color/.test(s.getAttribute('style')||''));
    w.clearBlockAtCaret();
    ok('插入后立刻「清除这个色块的底色」生效', !!box36&&!box36.style.backgroundColor,
       'status='+$('status').textContent.slice(0,24));
    // 把光标放进刚刚清掉底色的那个容器（它已无底色/无边框，只剩内边距）
    { const rc=d.createRange(); rc.selectNodeContents(box36); rc.collapse(true);
      sel().removeAllRanges(); sel().addRange(rc); }
    const reFound=w.findContainer(sel().getRangeAt(0));
    ok('清除底色后容器仍被识别（可继续操作）', !!reFound,
       'kind='+(reFound||{}).kind+' style='+(box36.getAttribute('style')||'').slice(0,60));    w.unwrapContainer('block','色块');
    ok('清除底色后仍能删除容器（保留文字）', !!box36&&!$('preview').contains(box36),
       'status='+$('status').textContent.slice(0,22));

    // ---------- 16. 主按钮配色 & 格式刷提示 ----------
    ok('主按钮有专属 hover/active 规则（不被 .btn:hover 盖成白色）',
       !![...d.styleSheets[0].cssRules].some(r=>r.selectorText==='.btn.btn-primary:hover'));
    ok('「复制」常态为主色', w.getComputedStyle($('copyTop')).backgroundColor==='rgb(15, 76, 129)',
       w.getComputedStyle($('copyTop')).backgroundColor);
    ok('格式刷有悬浮提示条', !!$('brushBanner')&&/选中目标文字即套用/.test($('brushBanner').textContent));
    ok('格式刷光标不再是 copy（箭头+）',
       !/cursor:\s*copy/.test([...d.styleSheets[0].cssRules].map(r=>r.cssText).join('')));
    ok('「清除文字格式」命名清晰且有说明',
       /清除文字格式/.test($('clearFmt').textContent)&&
       /恢复成文章原本的样子/.test([...d.querySelectorAll('[data-menu=edit] .hint')].map(e=>e.textContent).join('')));
    // ---------- 17. 回归：不得给文字元素刷背景 / 框内外样式一致 ----------
    // 用一个「带明确样式」的段落作基准（框内外应当一致）
    const host=(()=>{ const h=d.querySelector('#preview > section > section')||d.querySelector('#preview > section');
      const p=d.createElement('p');
      p.setAttribute('style','color:rgb(68, 68, 68);font-size:15px;line-height:28.5px');
      p.textContent='框内外一致性测试文字';
      h.appendChild(p); return p; })();
    const parB=host;
    const beforeB=new Set([...d.querySelectorAll('#preview section')]);
    selectIn(parB); w.insertColorBlock();
    const boxB=[...d.querySelectorAll('#preview section')]
      .find(s=>!beforeB.has(s)&&/background-color/.test(s.getAttribute('style')||''));
    ok('色块容器存在且带底色', !!boxB, boxB&&(boxB.getAttribute('style')||'').slice(0,60));
    // 框内元素不得自带背景（会被刷白盖住底色）
    const innerBg=[...(boxB?boxB.querySelectorAll('[style]'):[])]
      .filter(e=>/background-color/.test(e.getAttribute('style')||''));
    ok('色块内部元素不带 background-color（不会刷白盖住底色）', innerBg.length===0,
       innerBg.map(e=>e.tagName).join(',')||'0 个');
    // 整篇输出里，文字类元素都不该被刷上背景
    const outDoc=new DOMParser().parseFromString($('output').value,'text/html');
    const textBg=[...outDoc.body.querySelectorAll('p,span,strong,b,em,li')]
      .filter(e=>/background-color/.test(e.getAttribute('style')||''));
    ok('整篇输出中段落/行内元素无 background-color（不再刷白）', textBg.length===0,
       textBg.length?textBg.slice(0,3).map(e=>e.tagName).join(','):'0 个');
    // 框内外文字样式一致
    if(boxB){
      const csIn=w.getComputedStyle(boxB);
      ok('框内文字样式继承周围段落（颜色/字号一致）',
         csIn.color==='rgb(68, 68, 68)'&&csIn.fontSize==='15px',
         '框内 '+csIn.color+'/'+csIn.fontSize+'（应为 rgb(68, 68, 68)/15px）');
    }
    // ---------- 18. 微信兼容后处理（wechatSafe）：div→section / rgba→实色 / 剥表现属性 ----------
    const doc18=new DOMParser().parseFromString($('output').value,'text/html');
    ok('输出中不残留 <div>（div 会被微信吞掉、背景全丢）',
       doc18.body.querySelectorAll('div').length===0,
       'div 数量='+doc18.body.querySelectorAll('div').length);
    ok('输出中无 rgba 半透明色（部分微信版本会丢）',
       !/rgba\(\s*\d/.test($('output').value));
    const presentAttrs=[...doc18.body.querySelectorAll('*')]
      .filter(e=>['width','height','align','bgcolor','border','cellpadding','cellspacing','valign','nowrap'].some(a=>e.hasAttribute(a)));
    ok('输出中无 HTML 表现属性（会被判固定宽度）', presentAttrs.length===0,
       presentAttrs.slice(0,3).map(e=>e.tagName).join(',')||'0 个');
    const tbl=doc18.body.querySelector('table');
    ok('表格补了 width:100%', !tbl||/width:\s*100%/i.test(tbl.getAttribute('style')||''),
       tbl?(tbl.getAttribute('style')||'').slice(0,40):'无表格');
    // 色块仍然是 section 且带背景/圆角/内边距
    const box18=[...doc18.body.querySelectorAll('section')].filter(s=>/background-color/.test(s.getAttribute('style')||'')
      &&/border-radius/.test(s.getAttribute('style')||'')&&/padding/.test(s.getAttribute('style')||''));
    ok('色块/卡片在输出中保持 section + 背景 + 圆角 + 内边距', box18.length>0, box18.length+' 个');
    document.getElementById('results').textContent=out.join('\n');
  }catch(e){
    document.getElementById('results').textContent='ERROR: '+e.message+'\n'+(e.stack||'');
  }
});
</script>
</body>
</html>
