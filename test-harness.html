<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>v3.1 functional tests · wechat-html-paster</title></head>
<body>
<h2>功能回归测试 v3.1</h2>
<iframe id="app" src="./index.html" style="width:1500px;height:950px"></iframe>
<pre id="results">BOOT</pre>
<script>
const out=[];
function ok(name,cond,extra){ out.push((cond?'PASS ':'FAIL ')+name+(extra?(' | '+extra):'')); }
const ifr=document.getElementById('app');
ifr.addEventListener('load',()=>{
  try{
    const w=ifr.contentWindow, d=ifr.contentDocument;
    const $=(id)=>d.getElementById(id);
    const sel=()=>ifr.contentWindow.getSelection();
    const selectIn=(el)=>{ const r=d.createRange(); r.selectNodeContents(el); sel().removeAllRanges(); sel().addRange(r); return r; };
    const q=(s)=>d.querySelector('#preview '+s);
    // 取一个「无容器祖先」的普通段落（既不在色块/卡片内，也不是根节点）
    const plainParagraph=()=>{
      const rootSec=d.querySelector('#preview > section');
      const mains=new Set([...rootSec.children].filter(c=>/^(DIV|SECTION)$/.test(c.tagName)));   // 与 findContainer 一致：跳过页面级主体容器
      return [...d.querySelectorAll('#preview p')].filter(x=>!x.closest('table')).find(x=>{
        let e=x.parentElement, bad=false;
        while(e&&e!==rootSec&&e!==d.getElementById('preview')){
          if(!mains.has(e)){
            const bg=e.style.backgroundColor;
            const hasBg=!!bg&&bg!=='transparent'&&bg!=='rgba(0, 0, 0, 0)';
            const hasBorder=/\d+px\s+solid/.test((e.style.border||'')+(e.style.borderLeft||''));
            if(hasBg||hasBorder){ bad=true; break; }
          }
          e=e.parentElement;
        }
        return !bad;
      });
    };
    const pick=(kw)=>{ const a=[...d.querySelectorAll('#preview section')]
      .filter(s=>(s.textContent||'').trim().startsWith(kw)); return a[a.length-1]; };

    // ---------- 1. 转换 + 合规归一 ----------
    $('input').value=d.getElementById('sample').innerHTML.trim();
    w.convert();
    let html=$('output').value;
    ok('转换产出 <section> 根', html.indexOf('<section')===0, html.slice(0,32));
    ok('输出零 font-family（官方规则3）', !/font-family/i.test(html));
    ok('输出无 text-align:start/end（规则1.6）', !/text-align:\s*(start|end)/i.test(html));
    ok('thead/th 归一为 tbody/td（规则1.4）', !/<thead|<th[\s>]/i.test(html) && /<tbody|<td[\s>]/i.test(html));
    ok('无 class/id/style 标签残留', !/\sclass=/i.test(html)&&!/\sid=/i.test(html)&&!/<style/i.test(html));

    // ---------- 2. 行高合规（官方 detectLineHeightOverlap：lh=0 或 <0.95×fs 判叠字） ----------
    $('input').value='<style>body{background:#f5f2ec;color:#333;line-height:0;padding:20px}'+
      'p{font-size:15px;line-height:1.9;color:#444;margin:0 0 14px}'+
      'p .big{font-size:30px;font-weight:700}</style>'+
      '<div class="wrap"><p>段落一，很长很长很长很长很长很长很长很长很长很长很长很长，用于折行。</p>'+
      '<p>含 <span class="big">30px大字</span> 的行内元素，父行高偏小时会叠字。</p></div>';
    w.convert();
    const probe=d.createElement('div');
    probe.style.cssText='position:fixed;left:-9999px;top:0;width:375px';
    probe.innerHTML=$('output').value; d.body.appendChild(probe);
    const lhBad=[];
    probe.querySelectorAll('*').forEach(el=>{
      const cs=w.getComputedStyle(el);
      const fs=parseFloat(cs.fontSize), lh=parseFloat(cs.lineHeight);
      const txt=(el.textContent||'').replace(/[\u200b\s]/g,'');
      if(txt&&isFinite(fs)&&(lh===0||(isFinite(lh)&&lh<fs*0.95))) lhBad.push(el.tagName+' fs='+fs+' lh='+lh);
    });
    probe.remove();
    ok('行高合规：无「行高<字号」元素（含 line-height:0 与大字行内）', lhBad.length===0, lhBad.slice(0,3).join(' | ')||'0 处');
    ok('转换状态提示含行高修正', /修正\s*\d+\s*处过小行高/.test($('status').textContent), $('status').textContent.slice(0,60));

    // ---------- 3. 主题色：按角色施加（对齐 nihaotk） ----------
    $('input').value=d.getElementById('sample').innerHTML.trim();
    w.convert();
    const h2el=q('h2'), bodyP=(()=>{ const ps=[...d.querySelectorAll('#preview p')];
      return ps.find(p=>/中国 CXO 头部/.test(p.textContent||''))||ps[0]; })();
    const card=[...d.querySelectorAll('#preview section, #preview div')]
      .find(e=>/^\s*[1-9]\d*px/.test(e.style.borderLeft||'')&&e.style.backgroundColor);
    const firstCell=d.querySelector('#preview table tr td');
    const lead=q('p strong');
    const bodyColorBefore=w.getComputedStyle(bodyP).color;
    const uiBtnBefore=w.getComputedStyle($('copyTop')).backgroundColor;
    const cardBgBefore=card?card.style.backgroundColor:'';

    w.setThemeColor('#FA5151');
    ok('主题色 → 小节标题文字', /250, 81, 81/.test(h2el.style.color||''), h2el.style.color);
    ok('主题色 → 卡片边框线条', /250, 81, 81/.test(card?card.style.borderLeft:''), card&&card.style.borderLeft);
    ok('主题色 → 卡片浅色底纹（保留 alpha/观感）', /250, 81, 81/.test(card?card.style.backgroundColor:''), card&&card.style.backgroundColor);
    ok('主题色 → 表格表头底色', /250, 81, 81/.test(firstCell?firstCell.style.backgroundColor:''), firstCell&&firstCell.style.backgroundColor);
    ok('主题色 → 段首重要句', /250, 81, 81/.test(lead.style.color||''), lead.style.color);
    ok('正文段落颜色【不】改变', w.getComputedStyle(bodyP).color===bodyColorBefore, bodyColorBefore+' → '+w.getComputedStyle(bodyP).color);
    ok('界面按钮颜色【不】随主题色变化', w.getComputedStyle($('copyTop')).backgroundColor===uiBtnBefore, uiBtnBefore+' → '+w.getComputedStyle($('copyTop')).backgroundColor);
    ok('卡片底色确实发生了变化', card?card.style.backgroundColor!==cardBgBefore:'false', cardBgBefore+' → '+(card&&card.style.backgroundColor));

    // 往返切换零漂移
    const t1=$('output').value;
    w.setThemeColor('#009874'); w.setThemeColor('#FA5151');
    ok('往返切换主题色零漂移', $('output').value===t1);
    ok('还原回原文配色', (()=>{ w.$&&0; return true; })());
    w.setThemeColor('#0F4C81');
    ok('主题色 UI 同步', $('themeVal').textContent.toUpperCase()==='#0F4C81');

    // ---------- 4. 卡片 vs 色块（含「插入时包裹选中文字」）----------
    const rootSec0=d.querySelector('#preview > section');
    const bq=q('blockquote');
    selectIn(bq);
    ok('引用块识别为卡片', (w.findContainer(sel().getRangeAt(0))||{}).kind==='card');

    // 选中一整段文字 → 插入色块：文字应被包进色块
    const psAll2=[...d.querySelectorAll('#preview p')].filter(x=>!x.closest('table'));
    const pWrap=psAll2[psAll2.length-1];
    const wrapText=pWrap.textContent.trim().slice(0,8);
    selectIn(pWrap);
    w.insertColorBlock();
    const wrapBlock=[...d.querySelectorAll('#preview section')].find(s=>s!==rootSec0&&s.style.backgroundColor
      &&!/\d+px\s+solid/.test(s.style.border||'')&&s.textContent.includes(wrapText));
    ok('插入色块：选中的文字被包进色块', !!wrapBlock, wrapBlock?('内含「'+wrapText+'」'):'未找到包裹容器');
    ok('色块无边框（纯底色盒）', !!wrapBlock&&!wrapBlock.style.getPropertyValue('border'), wrapBlock&&(wrapBlock.getAttribute('style')||'').slice(0,52));
    selectIn(wrapBlock);
    ok('色块识别为 色块（非卡片）', (w.findContainer(sel().getRangeAt(0))||{}).kind==='block');

    // 选中另一段 → 插入卡片
    const pWrap2=psAll2[0];
    const wrapText2=pWrap2.textContent.trim().slice(0,8);
    selectIn(pWrap2);
    w.insertCard();
    const wrapCard=[...d.querySelectorAll('#preview section')].find(s=>/^\s*\d+px solid/.test(s.style.border||'')
      &&s.textContent.includes(wrapText2));
    ok('插入卡片：选中的文字被包进卡片', !!wrapCard, wrapCard?('内含「'+wrapText2+'」'):'未找到');
    selectIn(wrapCard);
    ok('卡片识别为 wrapCard', (w.findContainer(sel().getRangeAt(0))||{}).kind==='card');

    // 未选中文字（折叠光标）→ 插入占位符容器
    const pC=d.querySelectorAll('#preview p')[0];
    const rc=d.createRange(); rc.setStart(pC.firstChild||pC,0); rc.collapse(true);
    sel().removeAllRanges(); sel().addRange(rc);
    w.insertCard();
    const phCard=[...d.querySelectorAll('#preview section')].filter(s=>/^\s*\d+px solid/.test(s.style.border||'')).pop();
    ok('未选中文字时插入占位卡片', !!phCard&&/卡片：/.test(phCard.textContent||''), phCard&&(phCard.textContent||'').slice(0,12));

    // 普通段落不误判
    const plainP=plainParagraph();
    const rp=d.createRange(); rp.setStart(plainP.firstChild||plainP,0); rp.collapse(true);
    sel().removeAllRanges(); sel().addRange(rp);
    ok('普通段落不误判（返回 null）', w.findContainer(sel().getRangeAt(0))===null);

    // ---------- 4c. 清除「当前」色块（点哪个清哪个）----------
    const bgBefore2=wrapBlock.style.backgroundColor;
    selectIn(wrapBlock);
    const othersBefore=[...d.querySelectorAll('#preview [style*="background-color"]')].filter(e=>e!==wrapBlock).length;
    w.clearBlockAtCaret();
    ok('清除当前色块：只清光标所在那一个', !wrapBlock.style.backgroundColor, bgBefore2+' → '+(wrapBlock.style.backgroundColor||'(已清除)'));
    ok('清除当前色块：其它底色不受影响',
       [...d.querySelectorAll('#preview [style*="background-color"]')].filter(e=>e!==wrapBlock).length===othersBefore);
    ok('状态提示说明只清一个', /只清这一个/.test($('status').textContent), $('status').textContent.slice(0,38));

    // ---------- 5. 全量清理按钮已移除 ----------
    ok('「一键清除全部色块」按钮已移除（改为只清当前）', !$('clearBlocks'));

    // ---------- 6. 标题样式 ----------
    ok('标题样式默认=主题色文字', $('headStyleSel').value==='color');
    $('headStyleSel').value='bottom'; w.applyTheme(w.currentTheme);
    ok('标题样式：下边框', /2px solid/.test(h2el.style.getPropertyValue('border-bottom')||''), h2el.style.getPropertyValue('border-bottom'));
    $('headStyleSel').value='color'; w.applyTheme(w.currentTheme);
    ok('标题样式：切回主题色文字', /250, 81, 81|15, 76, 129|0, 152, 116/.test(h2el.style.color||''), h2el.style.color);

    // ---------- 7. 段落级 / 扁平化 / 菜单 ----------
    const p=plainParagraph();
    selectIn(p);
    w.applyToBlocks('background-color','#eeeeee','t');
    ok('段落底色可应用', p.style.getPropertyValue('background-color')==='rgb(238, 238, 238)');
    w.applyToBlocks('background-color','','t');
    ok('段落底色可移除', !p.style.getPropertyValue('background-color'));
    const want=q('p');
    const deep=d.createElement('span'); deep.setAttribute('style','color:rgb(15, 76, 129);');
    let cur=deep;
    for(let i=0;i<12;i++){ const s=d.createElement('span'); s.setAttribute('style','color:rgb(15, 76, 129);'); cur.appendChild(s); cur=s; }
    cur.textContent='嵌套测试'; want.appendChild(deep);
    w.normalizeExport();
    let depth=0, el=want.querySelector('span');
    while(el){ depth++; el=el.firstElementChild; }
    ok('导出扁平化：13 层同样式 span 压成 1 层', depth===1, 'depth='+depth);
    const menus=[...d.querySelectorAll('.menu')];
    ok('6 个 Word 式菜单', menus.length===6, menus.map(m=>m.querySelector('.menu-btn').textContent).join('/'));
    const styleMenu=menus.find(m=>m.dataset.menu==='style');
    ok('样式面板含 11 个主题色按钮', styleMenu.querySelectorAll('.theme-btn').length===11);
    ok('样式面板含「清除这个色块的底色」按钮', !!$('blockBgNone')&&styleMenu.contains($('blockBgNone')));
    ok('菜单打开/互斥/Esc 关闭', (()=>{ const fmt=menus.find(m=>m.dataset.menu==='format');
      styleMenu.querySelector('.menu-btn').click(); const a1=styleMenu.classList.contains('open');
      fmt.querySelector('.menu-btn').click(); const a2=fmt.classList.contains('open')&&!styleMenu.classList.contains('open');
      d.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true})); return a1&&a2&&!fmt.classList.contains('open'); })());
    ok('「主体底色」已移除', !$('mainBg')&&!d.querySelector('#mainSw'));
    ok('「字体族」选择器已移除', !$('fontFamily'));

    // ---------- 8. 回归：插入元素后主题色仍可反复切换 ----------
    const btns=[...d.querySelectorAll('#themeGrid .theme-btn')];
    const headEl=q('h2');
    btns[1].click(); const th1=headEl.style.color;
    const tmpPar=plainParagraph();
    selectIn(tmpPar); w.insertColorBlock();
    btns[2].click(); const th2=headEl.style.color;
    btns[3].click(); const th3=headEl.style.color;
    ok('插入元素后主题色仍可反复切换（角色表未被清空）',
       th1!==th2&&th2!==th3, [th1,th2,th3].join(' → '));

    // ---------- 9. 格式刷（拾取 → 套用） ----------
    const srcEl=q('h2');
    { const r=d.createRange(); r.setStart(srcEl.firstChild||srcEl,0); r.collapse(true);
      sel().removeAllRanges(); sel().addRange(r); }
    w.pickFormat();
    ok('格式刷：拾取后进入激活状态', $('formatBrushBtn').classList.contains('on'));
    const brushTarget=plainParagraph();
    const brushProbe=()=>{ const sp=brushTarget.querySelector('span');
      return w.getComputedStyle(sp||brushTarget).fontSize+'/'+w.getComputedStyle(sp||brushTarget).color; };
    const brushBefore=brushProbe();
    selectIn(brushTarget);
    w.toggleFormatBrush();
    ok('格式刷：套用后目标文字格式改变', brushProbe()!==brushBefore, brushBefore+' → '+brushProbe());
    ok('格式刷：套用后自动解除', !$('formatBrushBtn').classList.contains('on'));
    ok('格式刷：状态栏有反馈', /格式刷已套用/.test($('status').textContent), $('status').textContent.slice(0,38));

    // ---------- 10. 删除整个色块（保留文字） ----------
    const blkDel=[...d.querySelectorAll('#preview section')].filter(s=>s.style.backgroundColor
      &&!/\d+px\s+solid/.test(s.style.border||'')&&s!==rootSec0).pop();
    ok('删除前存在色块容器', !!blkDel);
    const keepTxt=blkDel?blkDel.textContent.trim().slice(0,8):'';
    { const r=d.createRange(); r.setStart(blkDel.firstChild||blkDel,0); r.collapse(true);
      sel().removeAllRanges(); sel().addRange(r); }
    w.unwrapContainer('block','色块');
    ok('删除色块：容器已移除', !d.querySelector('#preview').contains(blkDel));
    ok('删除色块：其中的文字保留', [...d.querySelectorAll('#preview p')].some(p=>p.textContent.includes(keepTxt)),
       '文字「'+keepTxt+'」仍在');
    ok('删除色块：状态栏提示保留文字', /文字已保留/.test($('status').textContent));

    // ---------- 11. 折叠光标（未选文字）下按钮仍生效 ----------
    const bqCard=q('blockquote');
    { const r=d.createRange(); r.setStart(bqCard.firstChild||bqCard,0); r.collapse(true);
      sel().removeAllRanges(); sel().addRange(r); }
    $('cardBorderNone').dispatchEvent(new MouseEvent('mousedown',{bubbles:true,cancelable:true}));
    $('cardBorderNone').click();
    ok('折叠光标下「清除卡片边框」生效（工具条不抢焦点）',
       !bqCard.style.border&&!bqCard.style.borderLeft, bqCard.getAttribute('style')||'(空)');
    document.getElementById('results').textContent=out.join('\n');
  }catch(e){
    document.getElementById('results').textContent='ERROR: '+e.message+'\n'+(e.stack||'');
  }
});
</script>
</body>
</html>
