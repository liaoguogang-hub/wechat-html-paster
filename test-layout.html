<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>layout test v3.1 · wechat-html-paster</title></head>
<body>
<h2>布局 / 隔离 / 交互 测试 v3.1</h2>
<iframe id="app" src="./index.html" style="width:1500px;height:950px"></iframe>
<pre id="results">BOOT</pre>
<script>
const out=[];
function ok(name,cond,extra){ out.push((cond?'PASS ':'FAIL ')+name+(extra?(' | '+extra):'')); }
const ifr=document.getElementById('app');
ifr.addEventListener('load',()=>{
  try{
    const w=ifr.contentWindow, d=ifr.contentDocument;
    const $=(id)=>d.getElementById(id);
    const R=(el)=>{ const b=el.getBoundingClientRect(); return {x:Math.round(b.x),y:Math.round(b.y),w:Math.round(b.width),h:Math.round(b.height)}; };
    const snap=()=>({
      appbarH:R(d.querySelector('.appbar')).h,
      toolRowY:R(d.querySelector('.toolbar-row')).y,
      toolRowH:R(d.querySelector('.toolbar-row')).h,
      menuX:R(d.querySelector('.menubar')).x,
      previewY:R($('preview')).y,
      sourceW:R(d.querySelector('.pane-source')).w,
      previewPaneW:R(d.querySelector('.pane-preview')).w,
      previewW:R($('preview')).w,
      statusH:R(d.querySelector('.statusbar')).h,
      bodyPadL:w.getComputedStyle(d.body).paddingLeft,
      bodyBg:w.getComputedStyle(d.body).backgroundColor
    });
    const a=snap();

    // ---------- 1. 工具栏位置：预览区上方（右侧栏），左栏保持纯输入 ----------
    ok('工具栏不在顶部整条，而在右侧预览面板内',
       d.querySelector('.pane-preview .toolbar-row')!==null && d.querySelector('.appbar .menubar')===null);
    ok('工具栏位于预览上方', a.toolRowY < a.previewY, 'toolbar.y='+a.toolRowY+' preview.y='+a.previewY);
    ok('工具栏在右侧（位于左输入栏之后）', a.toolRowY===0||a.toolRowY>=0 ? (a.menuX > R(d.querySelector('.pane-source')).w) : false,
       'menuX='+a.menuX+' 左栏宽='+R(d.querySelector('.pane-source')).w);
    ok('菜单条仍是最左的控件组（在工具栏行内靠左）',
       a.menuX - R(d.querySelector('.pane-preview')).x < 40, 'menuX-面板x='+(a.menuX-R(d.querySelector('.pane-preview')).x));
    ok('6 个菜单横排且在同一行', (()=>{ const b=[...d.querySelectorAll('.menu-btn')].map(R);
      return b.length===6 && b.every(x=>x.y===b[0].y); })());
    ok('左输入 / 右预览 双栏', a.sourceW>200&&a.previewPaneW>200&&R(d.querySelector('.pane-source')).x<R(d.querySelector('.pane-preview')).x);
    ok('存在可拖拽分隔条', !!$('splitter'));

    // ---------- 2. 载入前后零位移 + CSS 隔离 ----------
    $('input').value=d.getElementById('sample').innerHTML.trim();
    w.convert();
    const p=d.querySelector('#preview p');
    const r=d.createRange(); r.selectNodeContents(p);
    const s=ifr.contentWindow.getSelection(); s.removeAllRanges(); s.addRange(r);
    w.reflectSelection();
    const b=snap();
    ok('顶栏高度不变', a.appbarH===b.appbarH, a.appbarH+' -> '+b.appbarH);
    ok('工具栏行高度不变', a.toolRowH===b.toolRowH, a.toolRowH+' -> '+b.toolRowH);
    ok('工具栏行位置不变', a.toolRowY===b.toolRowY, a.toolRowY+' -> '+b.toolRowY);
    ok('菜单条位置不变', a.menuX===b.menuX, a.menuX+' -> '+b.menuX);
    ok('左栏宽度不变', a.sourceW===b.sourceW, a.sourceW+' -> '+b.sourceW);
    ok('右栏宽度不变', a.previewPaneW===b.previewPaneW, a.previewPaneW+' -> '+b.previewPaneW);
    ok('预览顶部位置不变（工具栏不会把它挤下去）', a.previewY===b.previewY, a.previewY+' -> '+b.previewY);
    ok('状态栏高度恒定', a.statusH===b.statusH&&a.statusH>0, a.statusH+' -> '+b.statusH);
    ok('文章 CSS 未泄漏（body padding）', a.bodyPadL===b.bodyPadL, a.bodyPadL+' -> '+b.bodyPadL);
    ok('文章 CSS 未泄漏（body 背景）', a.bodyBg===b.bodyBg, a.bodyBg+' -> '+b.bodyBg);

    // ---------- 3. 主题色板不重叠（用户反馈「挤在一起」）----------
    const styleMenu=[...d.querySelectorAll('.menu')].find(m=>m.dataset.menu==='style');
    styleMenu.querySelector('.menu-btn').click();
    const btns=[...styleMenu.querySelectorAll('.theme-btn')].map(R);
    let overlap=0;
    for(let i=0;i<btns.length;i++) for(let j=i+1;j<btns.length;j++){
      const A=btns[i],B=btns[j];
      if(A.x<B.x+B.w&&B.x<A.x+A.w&&A.y<B.y+B.h&&B.y<A.y+A.h) overlap++;
    }
    ok('主题色板按钮无重叠', overlap===0, 'overlap='+overlap+' buttons='+btns.length);
    ok('主题色板按钮有足够宽度（≥96px）', btns.every(x=>x.w>=96), 'minW='+Math.min(...btns.map(x=>x.w)));
    const labels=[...styleMenu.querySelectorAll('.theme-btn')];
    ok('主题色名称完整显示（不被裁切）',
       labels.every(btn=>{ const t=btn.lastElementChild; return t.scrollWidth<=t.clientWidth+1; }),
       labels.map(b=>b.textContent.trim()).slice(0,4).join('/'));
    ok('面板内无内容溢出裁切',
       [...styleMenu.querySelector('.menu-panel').querySelectorAll('*')]
        .filter(e=>e.scrollWidth>e.clientWidth+1&&w.getComputedStyle(e).overflow==='visible').length===0);
    d.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));

    // ---------- 3b. 所有菜单面板都在视口内、可滚动 ----------
    const vw0=d.documentElement.clientWidth;
    const overflowPanels=[];
    [...d.querySelectorAll('.menu')].forEach(m=>{
      m.querySelector('.menu-btn').click();
      const p=m.querySelector('.menu-panel'), r=R(p);
      if(r.x<-1 || r.x+r.w>vw0+1) overflowPanels.push(m.dataset.menu+'('+r.x+'..'+(r.x+r.w)+'/'+vw0+')');
      if(p.scrollHeight>p.clientHeight+1 && w.getComputedStyle(p).overflowY==='visible') overflowPanels.push(m.dataset.menu+'(不可滚动)');
    });
    d.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
    ok('全部菜单面板完整可见（不超出视口）', overflowPanels.length===0, overflowPanels.join(' | ')||'6/6 通过');
    ok('样式面板过宽时改为换行+内部滚动（不被裁掉）', (()=>{
      styleMenu.querySelector('.menu-btn').click();
      const p=styleMenu.querySelector('.menu-panel');
      const okFit=p.getBoundingClientRect().right<=vw0+1;
      const okScroll=p.scrollHeight<=p.clientHeight+1||p.scrollHeight>0;
      d.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
      return okFit&&okScroll; })());

    const copyBg=w.getComputedStyle($('copyTop')).backgroundColor;
    const convBg=w.getComputedStyle($('convert')).backgroundColor;
    const verBg=w.getComputedStyle($('verBadge')).backgroundColor;
    w.setThemeColor('#FECE00');
    ok('主题色变化不影响「复制」按钮', w.getComputedStyle($('copyTop')).backgroundColor===copyBg, copyBg);
    ok('主题色变化不影响「转换并适配公众号」按钮', w.getComputedStyle($('convert')).backgroundColor===convBg, convBg);
    ok('主题色变化不影响版本徽章', w.getComputedStyle($('verBadge')).backgroundColor===verBg, verBg);

    // ---------- 5. 预览设备切换 ----------
    d.querySelector('#deviceSeg button[data-dev="mobile"]').click();
    ok('移动端预览 375px 手机框', Math.abs(R($('preview')).w-375)<=2, R($('preview')).w+'px');
    ok('手机框有描边与阴影',
       w.getComputedStyle($('preview')).borderLeftWidth!=='0px'&&w.getComputedStyle($('preview')).boxShadow!=='none');
    d.querySelector('#deviceSeg button[data-dev="pc"]').click();
    ok('电脑端自适应 578px', Math.abs(R($('preview')).w-578)<=2, R($('preview')).w+'px');

    // ---------- 6. 分隔条拖拽 ----------
    const before=R(d.querySelector('.pane-source')).w;
    const sp=$('splitter'), ws=$('workspace'), wr=R(ws);
    sp.dispatchEvent(new MouseEvent('mousedown',{bubbles:true,clientX:wr.x+before,clientY:wr.y+40}));
    w.dispatchEvent(new MouseEvent('mousemove',{bubbles:true,clientX:wr.x+wr.w*0.55,clientY:wr.y+40}));
    w.dispatchEvent(new MouseEvent('mouseup',{bubbles:true}));
    ok('分隔条拖拽改变左栏宽度', R(d.querySelector('.pane-source')).w!==before, before+' -> '+R(d.querySelector('.pane-source')).w);
    sp.dispatchEvent(new MouseEvent('dblclick',{bubbles:true}));

    // ---------- 7. 色块 / 卡片视觉区分 ----------
    // 折叠光标（未选中文字）→ 插入占位符容器
    const pEl=d.querySelector('#preview p');
    const rr=d.createRange(); rr.setStart(pEl.firstChild||pEl,0); rr.collapse(true);
    s.removeAllRanges(); s.addRange(rr);
    w.insertColorBlock(); w.insertCard();
    const rootSec=d.querySelector('#preview > section');
    const allSec=[...d.querySelectorAll('#preview section,#preview div')];
    const blk=allSec.filter(x=>x!==rootSec&&x.style.backgroundColor&&!/\d+px\s+solid/.test(x.style.border||'')).pop();
    const card=allSec.filter(x=>/^\s*\d+px solid/.test(x.style.border||'')).pop();
    const csB=w.getComputedStyle(blk), csC=w.getComputedStyle(card);
    ok('色块：有底色、无边框',
       csB.backgroundColor!=='rgba(0, 0, 0, 0)'&&csB.borderTopWidth==='0px'&&csB.borderLeftWidth==='0px',
       csB.backgroundColor+' / border '+csB.borderTopWidth);
    ok('卡片：有边框（宽度>0）', parseFloat(csC.borderLeftWidth)>0, 'border-left '+csC.borderLeftWidth);

    document.getElementById('results').textContent=out.join('\n');
  }catch(e){
    document.getElementById('results').textContent='ERROR: '+e.message+'\n'+(e.stack||'');
  }
});
</script>
</body>
</html>
